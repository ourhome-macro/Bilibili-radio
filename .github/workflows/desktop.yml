name: Desktop CI and Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'develop/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '24'
  RUST_VERSION: '1.97.1'

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    defaults:
      run:
        working-directory: bilibili-radio
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: bilibili-radio/py-radio/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r py-radio/requirements.txt
      - name: Test backend with isolated data
        run: python scripts/run_backend_tests.py
      - name: Test release version checks
        run: python -m unittest discover -s scripts/tests -v
      - name: Validate desktop version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            python scripts/check_desktop_version.py --tag $env:GITHUB_REF_NAME
          } else {
            python scripts/check_desktop_version.py
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: bilibili-radio/bilibili-player/package-lock.json
      - name: Install frontend dependencies
        working-directory: bilibili-radio/bilibili-player
        run: npm ci
      - name: Check types and build frontend
        working-directory: bilibili-radio/bilibili-player
        run: npm run build
      - name: Test player state and components
        working-directory: bilibili-radio/bilibili-player
        run: npm test

  build:
    name: Windows installer
    needs: test
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: bilibili-radio
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: bilibili-radio/py-radio/requirements.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: bilibili-radio/bilibili-player/package-lock.json
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "RUSTUP_TOOLCHAIN=$env:RUST_VERSION" >> $env:GITHUB_ENV
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: bilibili-radio/bilibili-player/src-tauri -> target
          shared-key: windows-desktop
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Validate artifact version
        id: version
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            python scripts/check_desktop_version.py --tag $env:GITHUB_REF_NAME
          } else {
            python scripts/check_desktop_version.py
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install frontend dependencies
        working-directory: bilibili-radio/bilibili-player
        run: npm ci
      - name: Build Windows x64 NSIS installer and embedded Python backend
        working-directory: bilibili-radio/bilibili-player
        run: npm run desktop:build -- --ci --no-sign --bundles nsis -- --locked
      # Geometry unit tests reuse the release dependencies built above.
      - name: Test native window geometry
        run: cargo test --release --locked --manifest-path bilibili-player/src-tauri/Cargo.toml
      - name: Smoke test packaged backend
        run: python scripts/smoke_desktop_backend.py py-radio/dist/bilibili-radio-backend.exe
      - name: Prepare release assets and SHA-256 checksum
        env:
          DESKTOP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $assetDir = Join-Path $env:RUNNER_TEMP 'release-assets'
          New-Item -ItemType Directory -Path $assetDir -Force | Out-Null
          $installer = Get-Item -LiteralPath "bilibili-player/src-tauri/target/release/bundle/nsis/Bilibili Radio_$($env:DESKTOP_VERSION)_x64-setup.exe"
          Copy-Item -LiteralPath $installer.FullName -Destination $assetDir
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$($installer.Name)" | Set-Content -LiteralPath (Join-Path $assetDir 'SHA256SUMS.txt') -Encoding utf8NoBOM
          @{version=$env:DESKTOP_VERSION; commit=$env:GITHUB_SHA; platform='windows-x64'; signed=$false} |
            ConvertTo-Json | Set-Content -LiteralPath (Join-Path $assetDir 'build-info.json') -Encoding utf8NoBOM
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-x64-installer
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: windows-x64-installer
          path: release-assets
      - name: Verify installer checksum
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish only after all assets have uploaded
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ needs.build.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-state.txt; then
            if [ "$(cat release-state.txt)" != 'true' ]; then
              echo 'This version is already published. Use a new version tag; published assets are not overwritten.' >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Bilibili Radio $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          if [ "$IS_PRERELEASE" = 'true' ]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
